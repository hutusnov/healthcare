# Vars áp dụng cho tất cả hosts
ansible_user: ubuntu
ansible_python_interpreter: /usr/bin/python3

# Project info
project_name: uit-healthcare
env: dev

# Loki endpoint (Promtail gửi log về đây)
loki_url: http://localhost:3100   # đổi thành IP/domain của Loki server nếu external

# Timezone
system_timezone: Asia/Ho_Chi_Minh

# Base packages cài trên tất cả nodes
base_packages:
  - curl
  - wget
  - git
  - vim
  - htop
  - net-tools
  - ca-certificates
  - gnupg
  - lsb-release
  - jq
  - unzip
  - fail2ban

# Reproduce roots for service playbooks.
healthcare_base_dir: /opt/uit-healthcare
data_services_root: "{{ healthcare_base_dir }}/data-services"
monitoring_root: "{{ healthcare_base_dir }}/monitoring"
wazuh_root: "{{ healthcare_base_dir }}/wazuh"

# Safety gates. Set these to true explicitly for from-zero bootstrap.
k3s_bootstrap_enabled: false
wazuh_bootstrap_enabled: false

# Local service defaults used by reproducible Docker compose playbooks.
redis_port: 6379
rabbitmq_amqp_port: 5672
rabbitmq_management_port: 15672
grafana_port: 3000
prometheus_port: 9090
loki_port: 3100
alertmanager_port: 9093
