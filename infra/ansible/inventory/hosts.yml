---
# Static inventory — UIT Healthcare
# Yêu cầu: ssh-agent đang chạy và đã ssh-add cả 2 keys
#
#   ssh-add ~/.ssh/openstack-key.pem
#   ssh-add ~/.ssh/aws-healthcare-key.pem
#
# Sử dụng:
#   ansible-playbook -i inventory/hosts.yml playbooks/audit.yml
#   ansible-playbook -i inventory/hosts.yml playbooks/audit.yml --limit openstack
#   ansible-playbook -i inventory/hosts.yml playbooks/audit.yml --limit aws
#   ansible-playbook -i inventory/hosts.yml playbooks/audit.yml --limit k3s_master

all:
  vars:
    ansible_user: ubuntu
    ansible_python_interpreter: /usr/bin/python3

  children:

    # ════════════════════════════════════════
    # OpenStack nodes — truy cập trực tiếp
    # Key forward từ ssh-agent local
    # ════════════════════════════════════════
    openstack:
      vars:
        ansible_ssh_common_args: >-
          -o StrictHostKeyChecking=no
          -o ConnectTimeout=10
          -o ForwardAgent=yes

      children:

        k3s_master:
          hosts:
            k3s-master-vpn:
              ansible_host: 192.168.120.73
              wireguard_ip: 10.8.0.1
              k3s_role: master
              description: "K3s control-plane | WireGuard VPN | Cloudflare Tunnel | Prometheus"

        k3s_workers:
          vars:
            ansible_ssh_common_args: >-
              -o StrictHostKeyChecking=no
              -o ConnectTimeout=10
              -o ForwardAgent=yes
              -o ProxyJump=ubuntu@192.168.120.73
          hosts:
            data-core-node:
              ansible_host: 192.168.100.83
              wireguard_ip: ""
              k3s_role: worker
              description: "K3s worker | Wazuh Manager | Grafana | Loki | Alertmanager"

            ai-ocr-worker:
              ansible_host: 192.168.100.169
              wireguard_ip: ""
              k3s_role: worker
              description: "K3s worker | OCR service"

    # ════════════════════════════════════════
    # AWS nodes
    # aws-vpn-node     : ProxyJump qua k3s-master-vpn
    # aws-backend-az1/2: Double ProxyJump (không có public IP)
    #   local → k3s-master-vpn → aws-vpn-node → BE node
    # Key KHÔNG lưu trên server — dùng ssh-agent forwarding
    # ════════════════════════════════════════
    aws:
      children:

        aws_vpn:
          vars:
            ansible_ssh_common_args: >-
              -o StrictHostKeyChecking=no
              -o ConnectTimeout=10
              -o ForwardAgent=yes
              -o ProxyJump=ubuntu@192.168.120.73
          hosts:
            aws-vpn-node:
              ansible_host: 10.0.5.40
              wireguard_ip: 10.8.0.2
              k3s_role: none
              description: "AWS WireGuard VPN node | node-exporter :9100"

        aws_backend:
          vars:
            # Double ProxyJump: local → k3s-master-vpn → aws-vpn-node → BE
            ansible_ssh_common_args: >-
              -o StrictHostKeyChecking=no
              -o ConnectTimeout=15
              -o ForwardAgent=yes
              -o ProxyJump=ubuntu@192.168.120.73,ubuntu@10.0.5.40
          hosts:
            aws-backend-az1:
              ansible_host: 10.0.138.155
              k3s_role: none
              description: "BE EC2 AZ-1a | Backend API :4000 | node-exporter :9100"

            aws-backend-az2:
              ansible_host: 10.0.153.123
              k3s_role: none
              description: "BE EC2 AZ-1b | Backend API :4000 | node-exporter :9100"

    # ════════════════════════════════════════
    # Logical groups
    # ════════════════════════════════════════
    k3s_cluster:
      children:
        k3s_master:
        k3s_workers:

    linux_nodes:
      children:
        openstack:
        aws:

    backend_nodes:
      hosts:
        aws-backend-az1:
        aws-backend-az2:

    vpn_nodes:
      hosts:
        k3s-master-vpn:
        aws-vpn-node:

    wazuh_nodes:
      hosts:
        k3s-master-vpn:
        data-core-node:
        ai-ocr-worker:
        aws-vpn-node:
        aws-backend-az1:
        aws-backend-az2:
