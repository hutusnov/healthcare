all:
  vars:
    env: staging
    env_name: staging
    ansible_user: ubuntu
    ansible_python_interpreter: /usr/bin/python3
    ansible_ssh_private_key_file: ~/.ssh/healthcare-staging
    ansible_become_flags: -n
    ansible_become_timeout: 60
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=no
      -o ConnectTimeout=30
      -o ServerAliveInterval=30
    secret_source: aws_secrets_manager
    aws_profile: healthcare-staging
    aws_region: ap-southeast-2
    aws_cli_path: /mnt/c/Program Files/Amazon/AWSCLIV2/aws.exe
    backend_secret_id: uit-healthcare-staging/backend
    staging_alb_dns_name: uit-healthcare-staging-alb-1465788081.ap-southeast-2.elb.amazonaws.com
    staging_target_group_arn: arn:aws:elasticloadbalancing:ap-southeast-2:009144422462:targetgroup/uit-healthcare-staging-tg/a0d4a0e96640454e
    backend_root: /opt/healthcare-backend
    db_container_name: healthcare-postgres
    db_name: project_test
    db_user: postgres
    db_backup_root: /opt/healthcare-backend/backups
  children:
    staging:
      children:
        staging_aws:
          children:
            staging_backend_nodes:
              hosts:
                staging-backend-az1:
                  ansible_host: 13.55.38.97
                  ansible_private_ip: 10.30.0.68
                  role: backend
                staging-backend-az2:
                  ansible_host: 3.25.134.246
                  ansible_private_ip: 10.30.1.128
                  role: backend
        linux_nodes:
          children:
            staging_backend_nodes:
        backend_nodes:
          children:
            staging_backend_nodes:
        data_services_nodes:
          hosts:
            staging-backend-az1:
        monitoring_nodes:
          hosts:
            staging-backend-az1:
        wazuh_manager:
          hosts:
            staging-backend-az1:
        k3s_master:
          hosts: {}
        k3s_workers:
          hosts: {}
