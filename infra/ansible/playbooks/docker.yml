---
# Install Docker Engine and Compose plugin on backend nodes.

- name: Install Docker runtime
  hosts: backend_nodes
  become: true
  gather_facts: true

  tasks:
    - name: Install Docker prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - python3-debian
        state: present
        update_cache: true

    - name: Remove legacy Docker apt source list
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/docker.list
        state: absent

    - name: Add Docker apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types:
          - deb
        uris:
          - https://download.docker.com/linux/ubuntu
        suites:
          - "{{ ansible_facts.distribution_release }}"
        components:
          - stable
        architectures:
          - "{{ ansible_facts.architecture | replace('x86_64', 'amd64') }}"
        signed_by: https://download.docker.com/linux/ubuntu/gpg
        state: present

    - name: Install Docker packages
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true
      when: not ansible_check_mode

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started
      when: not ansible_check_mode

    - name: Allow ubuntu user to run Docker
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true
      when: not ansible_check_mode
