[defaults]
inventory         = inventory/hosts.yml
roles_path        = roles
remote_user       = ubuntu
host_key_checking = False
stdout_callback   = default
callbacks_enabled = timer, profile_tasks
timeout           = 60
become_timeout    = 60

[ssh_connection]
ssh_args          = -o ForwardAgent=yes -o ControlMaster=no
pipelining        = False
