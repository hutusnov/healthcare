name: Load Test Staging

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Backend health URL to test"
        required: true
        default: "http://uit-healthcare-staging-alb-1465788081.ap-southeast-2.elb.amazonaws.com/api/health"
      vus:
        description: "Virtual users"
        required: true
        default: "10"
      duration:
        description: "Test duration"
        required: true
        default: "1m"
      max_p95_ms:
        description: "Fail if p95 latency is above this value"
        required: true
        default: "1000"

jobs:
  k6-backend-health:
    name: k6 backend health
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Run k6
        env:
          TARGET_URL: ${{ inputs.target_url }}
          VUS: ${{ inputs.vus }}
          DURATION: ${{ inputs.duration }}
          MAX_P95_MS: ${{ inputs.max_p95_ms }}
        run: |
          docker run --rm \
            -e TARGET_URL \
            -e VUS \
            -e DURATION \
            -e MAX_P95_MS \
            -v "$PWD/tests/load:/scripts:ro" \
            grafana/k6:0.56.0 run /scripts/backend-health.k6.js
