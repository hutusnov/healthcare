name: Load Test Staging

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Backend health URL to test"
        required: true
        default: "http://healthcare-backend-alb-1504175061.ap-southeast-1.elb.amazonaws.com/api/health"
      vus:
        description: "Virtual users"
        required: true
        default: "10"
      duration:
        description: "Test duration"
        required: true
        default: "1m"
      max_p95_ms:
        description: "Fail if p95 latency is above this value"
        required: true
        default: "1000"

jobs:
  k6-backend-health:
    name: k6 backend health
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Run k6
        env:
          TARGET_URL: ${{ inputs.target_url }}
          VUS: ${{ inputs.vus }}
          DURATION: ${{ inputs.duration }}
          MAX_P95_MS: ${{ inputs.max_p95_ms }}
        run: |
          set -euo pipefail

          wait_for_health() {
            for i in $(seq 1 30); do
              if curl --fail --show-error --silent "$TARGET_URL" | grep -q "Server is running"; then
                return 0
              fi
              echo "Backend health is not ready yet. Retry $i/30..."
              sleep 10
            done
            return 1
          }

          wait_for_health
          for attempt in 1 2 3; do
            echo "k6 attempt $attempt/3"
            if docker run --rm \
              -e TARGET_URL \
              -e VUS \
              -e DURATION \
              -e MAX_P95_MS \
              -v "$PWD/tests/load:/scripts:ro" \
              grafana/k6:0.56.0 run /scripts/backend-health.k6.js; then
              exit 0
            fi
            echo "k6 failed, waiting for backend to stabilize before retry..."
            sleep 30
            wait_for_health
          done
          exit 1
