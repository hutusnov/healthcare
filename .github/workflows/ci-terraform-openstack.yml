name: CI Terraform OpenStack

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  # Triggered only by pipeline-unified (which applies paths-filter)
  # or manually. Removing push/pull_request prevents duplicate runs
  # alongside pipeline-unified on every commit.
  workflow_call:
  workflow_dispatch:

jobs:
  validate-openstack-terraform:
    name: validate-openstack-terraform
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.2

      - name: Terraform fmt check
        run: terraform fmt -check -recursive infra/terraform-openstack

      - name: Terraform init and validate OpenStack envs
        shell: bash
        run: |
          for ENV_DIR in infra/terraform-openstack/envs/*; do
            [ -d "$ENV_DIR" ] || continue
            [ -f "$ENV_DIR/main.tf" ] || continue
            echo "Validating OpenStack env: $ENV_DIR"
            cd "$GITHUB_WORKSPACE/$ENV_DIR"
            terraform init -backend=false
            terraform validate
          done

      - name: Install Checkov
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install checkov

      - name: Checkov scan OpenStack Terraform
        shell: bash
        run: |
          if [ "${{ vars.TF_SECURITY_STRICT }}" = "true" ]; then
            checkov -d infra/terraform-openstack --framework terraform --quiet
          else
            checkov -d infra/terraform-openstack --framework terraform --quiet --soft-fail
          fi


  notify:
    name: Notify Telegram
    if: always()
    needs: [validate-openstack-terraform]
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 Workflow: ${{ github.workflow }}
            👤 Actor: ${{ github.actor }}
            📝 Commit: ${{ github.sha }}
            📊 Status: ${{ job.status }}
            🔗 Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
