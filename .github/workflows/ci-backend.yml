name: CI Backend

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

jobs:
  validate-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BACK-END/PROJECT-TEST
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: BACK-END/PROJECT-TEST/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: node -c src/app.js && node -c src/server.js
      - name: Run tests when available
        shell: bash
        run: |
          if node -e "const pkg=require('./package.json'); process.exit(pkg.scripts.test && !pkg.scripts.test.includes('no test specified') ? 0 : 1)"; then
            npm test
          else
            echo "Skipping tests: no test suite configured"
          fi


  notify:
    name: Notify Telegram
    if: always()
    needs: [validate-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 Workflow: ${{ github.workflow }}
            👤 Actor: ${{ github.actor }}
            📝 Commit: ${{ github.sha }}
            📊 Status: ${{ job.status }}
            🔗 Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
