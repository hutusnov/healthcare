name: CD Backend AWS EC2

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    if: vars.ENABLE_AWS_EC2_DEPLOY == 'true' && vars.AWS_GHA_ROLE_ARN != '' && (vars.AWS_BACKEND_INSTANCE_IDS != '' || vars.AWS_BACKEND_INSTANCE_ID != '')
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      BACKEND_IMAGE_NAME: healthcare-backend
    steps:
      - uses: actions/checkout@v6

      - name: Resolve backend image tag
        id: meta
        run: |
          OWNER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${OWNER}/${BACKEND_IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        run: |
          docker build -t "${{ steps.meta.outputs.image }}" ./BACK-END/PROJECT-TEST
          docker push "${{ steps.meta.outputs.image }}"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_GHA_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy backend over SSM
        shell: bash
        env:
          INSTANCE_IDS: ${{ vars.AWS_BACKEND_INSTANCE_IDS }}
          FALLBACK_INSTANCE_ID: ${{ vars.AWS_BACKEND_INSTANCE_ID }}
          BACKEND_IMAGE: ${{ steps.meta.outputs.image }}
          GHCR_USERNAME: ${{ secrets.GHCR_DEPLOY_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_DEPLOY_TOKEN }}
          DATABASE_URL: ${{ secrets.BACKEND_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.BACKEND_JWT_SECRET }}
          FRONTEND_URL: ${{ secrets.BACKEND_FRONTEND_URL }}
          ADMIN_PANEL_URL: ${{ secrets.BACKEND_ADMIN_PANEL_URL }}
          PATIENT_PORTAL_URL: ${{ secrets.BACKEND_PATIENT_PORTAL_URL }}
          MOMO_PARTNER_CODE: ${{ secrets.MOMO_PARTNER_CODE }}
          MOMO_NOTIFY_URL: ${{ secrets.MOMO_NOTIFY_URL }}
          MOMO_ACCESS_KEY: ${{ secrets.MOMO_ACCESS_KEY }}
          MOMO_SECRET_KEY: ${{ secrets.MOMO_SECRET_KEY }}
          MOMO_ENDPOINT: ${{ secrets.MOMO_ENDPOINT }}
          MOMO_RETURN_URL: ${{ secrets.MOMO_RETURN_URL }}
          X_SECRET_VERIFY_HEADER: ${{ secrets.X_SECRET_VERIFY_HEADER }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          compose = f"""services:
            backend:
              image: {os.environ["BACKEND_IMAGE"]}
              container_name: healthcare-backend
              restart: unless-stopped
              env_file: [.env]
              ports: ["4000:4000"]
          """
          env_file = f"""NODE_ENV=production
          PORT=4000
          DATABASE_URL={os.environ["DATABASE_URL"]}
          JWT_SECRET={os.environ["JWT_SECRET"]}
          PATIENT_PORTAL_URL={os.environ["PATIENT_PORTAL_URL"]}
          ADMIN_PANEL_URL={os.environ["ADMIN_PANEL_URL"]}
          FRONTEND_URL={os.environ["FRONTEND_URL"]}
          MOMO_PARTNER_CODE={os.environ["MOMO_PARTNER_CODE"]}
          MOMO_NOTIFY_URL={os.environ["MOMO_NOTIFY_URL"]}
          MOMO_ACCESS_KEY={os.environ["MOMO_ACCESS_KEY"]}
          MOMO_SECRET_KEY={os.environ["MOMO_SECRET_KEY"]}
          MOMO_ENDPOINT={os.environ["MOMO_ENDPOINT"]}
          MOMO_RETURN_URL={os.environ["MOMO_RETURN_URL"]}
          X_SECRET_VERIFY_HEADER={os.environ.get("X_SECRET_VERIFY_HEADER","")}
          """
          cmds = [
            "set -e",
            "sudo mkdir -p /opt/healthcare-backend",
            "cat > /opt/healthcare-backend/docker-compose.yml <<'EOF'\n"+compose+"\nEOF",
            "cat > /opt/healthcare-backend/.env <<'EOF'\n"+env_file+"\nEOF",
            f"echo {json.dumps(os.environ.get('GHCR_TOKEN',''))} | sudo docker login ghcr.io -u {json.dumps(os.environ.get('GHCR_USERNAME',''))} --password-stdin || true",
            "sudo systemctl enable --now docker || true",
            "if ! sudo docker compose version >/dev/null 2>&1; then sudo apt-get update && sudo apt-get install -y docker-compose-plugin || true; fi",
            "if ! sudo docker compose version >/dev/null 2>&1; then ARCH=$(uname -m); case \"$ARCH\" in x86_64|amd64) COMPOSE_ARCH=x86_64 ;; aarch64|arm64) COMPOSE_ARCH=aarch64 ;; *) echo \"Unsupported arch: $ARCH\"; exit 1 ;; esac; sudo mkdir -p /usr/local/lib/docker/cli-plugins; sudo curl -fsSL \"https://github.com/docker/compose/releases/download/v2.40.3/docker-compose-linux-${COMPOSE_ARCH}\" -o /usr/local/lib/docker/cli-plugins/docker-compose; sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose; fi",
            "sudo docker compose version",
            "sudo docker system prune -a -f --volumes || true",
            "sudo rm -rf /var/lib/containerd/io.containerd.content.v1.content/ingest/* || true",
            "cd /opt/healthcare-backend && sudo docker compose down --remove-orphans || true",
            "cd /opt/healthcare-backend && (sudo docker compose pull || (sudo systemctl restart docker || true; sleep 3; sudo docker compose pull))",
            "cd /opt/healthcare-backend && sudo docker compose up -d",
            "for i in $(seq 1 36); do curl -fsS http://127.0.0.1:4000/api/health && exit 0; sleep 5; done; sudo docker logs --tail 120 healthcare-backend || true; exit 1",
          ]
          Path("commands.json").write_text(json.dumps({"commands": cmds}))
          PY
          TARGET_IDS="$INSTANCE_IDS"; [ -z "$TARGET_IDS" ] && TARGET_IDS="$FALLBACK_INSTANCE_ID"
          TARGET_IDS="$(echo "$TARGET_IDS" | tr ',;' ' ' | xargs)"

          DISCOVERED_IDS="$(aws ec2 describe-instances \
            --filters \
              Name=tag:Project,Values=uit-healthcare \
              Name=tag:Component,Values=backend \
              Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text 2>/tmp/ec2_discovery_err.log || true)"

          if [ -n "$DISCOVERED_IDS" ]; then
            echo "Discovered active backend instances by tags: $DISCOVERED_IDS"
            TARGET_IDS="$TARGET_IDS $DISCOVERED_IDS"
          else
            echo "::warning::No backend instances discovered by Project=uit-healthcare,Component=backend tags."
            cat /tmp/ec2_discovery_err.log || true
          fi

          TARGET_IDS="$(echo "$TARGET_IDS" | tr '\t ' '\n' | sed '/^$/d' | sort -u | xargs)"
          [ -z "$TARGET_IDS" ] && { echo "::error::No backend instance IDs configured or discovered."; exit 1; }

          ONLINE_IDS=""
          OFFLINE_IDS=""
          for INSTANCE_ID in $TARGET_IDS; do
            PING_STATUS="$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/tmp/ssm_ping_err.log || true)"

            if [ "$PING_STATUS" = "Online" ]; then
              ONLINE_IDS="$ONLINE_IDS $INSTANCE_ID"
            else
              OFFLINE_IDS="$OFFLINE_IDS $INSTANCE_ID"
              echo "::warning::Skipping $INSTANCE_ID because SSM PingStatus is '${PING_STATUS:-Unknown}'. Check SSM agent/IAM/VPC endpoints before expecting HA deployment."
              cat /tmp/ssm_ping_err.log || true
            fi
          done

          ONLINE_IDS="$(echo "$ONLINE_IDS" | xargs)"
          OFFLINE_IDS="$(echo "$OFFLINE_IDS" | xargs)"
          if [ -z "$ONLINE_IDS" ]; then
            echo "::error::No online SSM backend instances available in target set: $TARGET_IDS"
            exit 1
          fi

          FAILED=0
          SUCCEEDED=0
          SUCCEEDED_IDS=""
          for INSTANCE_ID in $ONLINE_IDS; do
            echo "=== Deploying backend to $INSTANCE_ID ==="
            ATTEMPT_SUCCESS=0
            for ATTEMPT in 1 2 3; do
              echo "Attempt $ATTEMPT/3 for $INSTANCE_ID"
              CMD_ID="$(aws ssm send-command \
                --instance-ids "$INSTANCE_ID" \
                --document-name AWS-RunShellScript \
                --comment "Deploy healthcare backend from GitHub Actions" \
                --parameters file://commands.json \
                --query 'Command.CommandId' \
                --output text 2>/tmp/ssm_send_err.log || true)"

              if [ -z "$CMD_ID" ] || [ "$CMD_ID" = "None" ]; then
                echo "::warning::send-command did not return a command id for $INSTANCE_ID"
                cat /tmp/ssm_send_err.log || true
                sleep 15
                continue
              fi

              if aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID"; then
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --output json
                ATTEMPT_SUCCESS=1
                break
              else
                aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --output json || true
                sleep 15
              fi
            done

            if [ "$ATTEMPT_SUCCESS" -eq 1 ]; then
              SUCCEEDED=$((SUCCEEDED + 1))
              SUCCEEDED_IDS="$SUCCEEDED_IDS $INSTANCE_ID"
            else
              FAILED=$((FAILED + 1))
              echo "::error::Backend deploy failed after retries for $INSTANCE_ID"
            fi
          done

          echo "Deploy summary: success=$SUCCEEDED, failed=$FAILED, online_targets=$(echo "$ONLINE_IDS" | wc -w), configured_targets=$(echo "$TARGET_IDS" | wc -w)"
          if [ -n "$OFFLINE_IDS" ]; then
            echo "::warning::Configured backend instances not deployed because SSM is offline/undeliverable: $OFFLINE_IDS"
          fi

          TG_ARN="$(aws elbv2 describe-target-groups \
            --names healthcare-backend-tg \
            --query 'TargetGroups[0].TargetGroupArn' \
            --output text 2>/tmp/tg_lookup_err.log || true)"
          if [ "$TG_ARN" != "None" ] && [ -n "$TG_ARN" ] && [ -n "$(echo "$SUCCEEDED_IDS" | xargs)" ]; then
            TARGET_ARGS=""
            for INSTANCE_ID in $SUCCEEDED_IDS; do
              TARGET_ARGS="$TARGET_ARGS Id=$INSTANCE_ID,Port=4000"
            done
            echo "Registering successfully deployed backend targets in ALB target group: $SUCCEEDED_IDS"
            aws elbv2 register-targets --target-group-arn "$TG_ARN" --targets $TARGET_ARGS

            if [ -n "$OFFLINE_IDS" ]; then
              OFFLINE_TARGET_ARGS=""
              for INSTANCE_ID in $OFFLINE_IDS; do
                OFFLINE_TARGET_ARGS="$OFFLINE_TARGET_ARGS Id=$INSTANCE_ID,Port=4000"
              done
              echo "::warning::Deregistering offline backend targets from ALB target group: $OFFLINE_IDS"
              aws elbv2 deregister-targets --target-group-arn "$TG_ARN" --targets $OFFLINE_TARGET_ARGS || true
            fi
          else
            echo "::warning::Could not resolve healthcare-backend-tg or no successful backend deployments; skipping target group update."
            cat /tmp/tg_lookup_err.log || true
          fi

          [ "$SUCCEEDED" -gt 0 ] && [ "$FAILED" -eq 0 ]



  notify:
    name: Notify Telegram
    if: always()
    needs: [deploy-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 Workflow: ${{ github.workflow }}
            👤 Actor: ${{ github.actor }}
            📝 Commit: ${{ github.sha }}
            📊 Status: ${{ job.status }}
            🔗 Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
