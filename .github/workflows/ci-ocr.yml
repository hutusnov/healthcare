name: CI OCR Service

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  # Triggered only by pipeline-unified (which applies paths-filter)
  # or manually. Removing push/pull_request prevents duplicate runs
  # alongside pipeline-unified on every commit.
  workflow_call:
  workflow_dispatch:

jobs:
  validate-ocr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OCR
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: OCR/requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock pip-audit

      - name: Security audit
        run: |
          set -euo pipefail
          pip-audit --skip-editable --progress-spinner=off \
            --format json --output /tmp/ocr-pip-audit.json || audit_status=$?

          python ../scripts/ci/enforce-pip-audit-policy.py \
            --report /tmp/ocr-pip-audit.json \
            --policy ../security/pip-audit-policy/ocr.json

      - name: Syntax check
        run: python -m py_compile main.py ocr_services.py util.py

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ocr-pip-audit-report
          path: /tmp/ocr-pip-audit.json
          if-no-files-found: warn

      - name: Check no hardcoded secrets
        run: |
          if grep -rn "api_key\s*=\s*['\"][^'\"]\|password\s*=\s*['\"][^'\"]" \
            main.py ocr_services.py util.py; then
            echo "::error::Hardcoded secrets detected"
            exit 1
          fi
          echo "No hardcoded secrets found"

  notify:
    name: Notify Telegram
    if: always()
    needs: [validate-ocr]
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 Workflow: ${{ github.workflow }}
            👤 Actor: ${{ github.actor }}
            📝 Commit: ${{ github.sha }}
            📊 Status: ${{ job.status }}
            🔗 Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
