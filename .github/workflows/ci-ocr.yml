name: CI OCR Service

on:
  push:
    branches: [main, develop]
    paths:
      - "OCR/**"
      - ".github/workflows/ci-ocr.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "OCR/**"
      - ".github/workflows/ci-ocr.yml"
  workflow_call:
  workflow_dispatch:

jobs:
  validate-ocr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OCR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: OCR/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m py_compile main.py ocr_services.py util.py

