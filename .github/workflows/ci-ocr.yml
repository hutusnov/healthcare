name: CI OCR Service

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:
  workflow_dispatch:

jobs:
  validate-ocr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OCR
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: OCR/requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock

      - name: Security audit
        run: pip audit

      - name: Syntax check
        run: python -m py_compile main.py ocr_services.py util.py

      - name: Check no hardcoded secrets
        run: |
          if grep -rn "api_key\s*=\s*['\"][^'\"]\|password\s*=\s*['\"][^'\"]" \
            main.py ocr_services.py util.py; then
            echo "::error::Hardcoded secrets detected"
            exit 1
          fi
          echo "No hardcoded secrets found"

  notify:
    name: Notify Telegram
    if: always()
    needs: [validate-ocr]
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 Workflow: ${{ github.workflow }}
            👤 Actor: ${{ github.actor }}
            📝 Commit: ${{ github.sha }}
            📊 Status: ${{ job.status }}
            🔗 Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}