name: CI OCR Service

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  # Triggered only by pipeline-unified (which applies paths-filter)
  # or manually. Removing push/pull_request prevents duplicate runs
  # alongside pipeline-unified on every commit.
  workflow_call:
  workflow_dispatch:

jobs:
  validate-ocr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: OCR
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: OCR/requirements.lock

      - name: Install dependencies
        run: pip install -r requirements.lock pip-audit

      - name: Security audit
        run: |
          pip-audit --skip-editable --progress-spinner=off \
            --ignore-vuln PYSEC-2025-189 \
            --ignore-vuln PYSEC-2025-190 \
            --ignore-vuln PYSEC-2025-191 \
            --ignore-vuln PYSEC-2025-192 \
            --ignore-vuln PYSEC-2025-193 \
            --ignore-vuln PYSEC-2025-194 \
            --ignore-vuln PYSEC-2025-195 \
            --ignore-vuln PYSEC-2025-196 \
            --ignore-vuln PYSEC-2025-197 \
            --ignore-vuln PYSEC-2025-198 \
            --ignore-vuln PYSEC-2025-199 \
            --ignore-vuln PYSEC-2025-200 \
            --ignore-vuln PYSEC-2025-201 \
            --ignore-vuln PYSEC-2025-202 \
            --ignore-vuln PYSEC-2025-203 \
            --ignore-vuln PYSEC-2025-204 \
            --ignore-vuln PYSEC-2025-205 \
            --ignore-vuln PYSEC-2025-206 \
            --ignore-vuln PYSEC-2025-207 \
            --ignore-vuln PYSEC-2025-208 \
            --ignore-vuln PYSEC-2025-209 \
            --ignore-vuln PYSEC-2025-210 \
            --ignore-vuln PYSEC-2026-139 \
            --ignore-vuln CVE-2025-3730 \
            --ignore-vuln CVE-2024-28219 \
            --ignore-vuln CVE-2026-42308 \
            --ignore-vuln CVE-2026-42310 \
            --ignore-vuln CVE-2026-40491 \
            --ignore-vuln PYSEC-2024-277

      - name: Syntax check
        run: python -m py_compile main.py ocr_services.py util.py

      - name: Check no hardcoded secrets
        run: |
          if grep -rn "api_key\s*=\s*['\"][^'\"]\|password\s*=\s*['\"][^'\"]" \
            main.py ocr_services.py util.py; then
            echo "::error::Hardcoded secrets detected"
            exit 1
          fi
          echo "No hardcoded secrets found"

  notify:
    name: Notify Telegram
    if: always()
    needs: [validate-ocr]
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 Workflow: ${{ github.workflow }}
            👤 Actor: ${{ github.actor }}
            📝 Commit: ${{ github.sha }}
            📊 Status: ${{ job.status }}
            🔗 Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
