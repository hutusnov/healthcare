name: CD Frontend S3 CloudFront

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    if: vars.ENABLE_FRONTEND_S3_DEPLOY == 'true'
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Build patient portal
        working-directory: BACK-END/PROJECT-TEST/patient-portal
        run: |
          : "${VITE_API_URL:=http://healthcare-backend-alb-1504175061.ap-southeast-1.elb.amazonaws.com/api}"
          npm ci
          npm run build
          if grep -R "localhost:4000\\|localhost:8000" dist; then
            echo "::error::Production patient portal bundle still contains localhost API endpoints."
            exit 1
          fi
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_OCR_URL: ${{ secrets.VITE_OCR_URL }}
          VITE_OCR_API_KEY: ${{ secrets.VITE_OCR_API_KEY }}
          VITE_X_SECRET_VERIFY_HEADER: ${{ secrets.X_SECRET_VERIFY_HEADER }}

      - name: Build admin panel
        working-directory: BACK-END/PROJECT-TEST/admin-panel
        run: |
          : "${VITE_API_URL:=http://healthcare-backend-alb-1504175061.ap-southeast-1.elb.amazonaws.com/api}"
          npm ci
          npm run build
          if grep -R "localhost:4000\\|localhost:8000" dist; then
            echo "::error::Production admin panel bundle still contains localhost API endpoints."
            exit 1
          fi
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_X_SECRET_VERIFY_HEADER: ${{ secrets.X_SECRET_VERIFY_HEADER }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync Patient Portal to S3
        run: |
          aws s3 sync BACK-END/PROJECT-TEST/patient-portal/dist/ s3://${{ vars.PATIENT_PORTAL_S3_BUCKET }} --delete
          aws cloudfront create-invalidation --distribution-id ${{ vars.PATIENT_PORTAL_CLOUDFRONT_ID }} --paths "/*"

      - name: Sync Admin Panel to S3
        run: |
          aws s3 sync BACK-END/PROJECT-TEST/admin-panel/dist/ s3://${{ vars.ADMIN_PANEL_S3_BUCKET }} --delete
          aws cloudfront create-invalidation --distribution-id ${{ vars.ADMIN_PANEL_CLOUDFRONT_ID }} --paths "/*"


  notify:
    name: Notify Telegram
    if: always()
    needs: [deploy-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 Workflow: ${{ github.workflow }}
            👤 Actor: ${{ github.actor }}
            📝 Commit: ${{ github.sha }}
            📊 Status: ${{ job.status }}
            🔗 Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
