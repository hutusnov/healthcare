name: Security Trivy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-backend:
    name: Trivy Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build backend image for security scan
        run: docker build -t local/healthcare-backend:scan ./BACK-END/PROJECT-TEST

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          cache: false

      - name: Trivy gate - backend (CRITICAL)
        run: |
          trivy image \
            --severity CRITICAL \
            --ignore-unfixed \
            --format table \
            --exit-code 1 \
            local/healthcare-backend:scan

      - name: Trivy SARIF - backend
        if: always()
        run: |
          trivy image \
            --severity CRITICAL \
            --ignore-unfixed \
            --format sarif \
            --output trivy-backend.sarif \
            --exit-code 0 \
            local/healthcare-backend:scan

      - name: Upload backend SARIF
        if: always() && hashFiles('trivy-backend.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

  trivy-ocr:
    name: Trivy OCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build OCR image for security scan
        run: docker build -t local/healthcare-ocr:scan ./OCR

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          cache: false

      - name: Trivy gate - ocr (CRITICAL)
        run: |
          trivy image \
            --severity CRITICAL \
            --ignore-unfixed \
            --format table \
            --exit-code 1 \
            local/healthcare-ocr:scan

      - name: Trivy SARIF - ocr
        if: always()
        run: |
          trivy image \
            --severity CRITICAL \
            --ignore-unfixed \
            --format sarif \
            --output trivy-ocr.sarif \
            --exit-code 0 \
            local/healthcare-ocr:scan

      - name: Upload ocr SARIF
        if: always() && hashFiles('trivy-ocr.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-ocr.sarif
          category: trivy-ocr
