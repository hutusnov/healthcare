name: Security Trivy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-backend:
    name: Trivy Backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build backend image for security scan
        run: docker build -t local/healthcare-backend:scan ./BACK-END/PROJECT-TEST

      - name: Trivy gate - backend (CRITICAL)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: local/healthcare-backend:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Trivy SARIF - backend
        if: always()
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: local/healthcare-backend:scan
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 0

      - name: Upload backend SARIF
        if: always() && hashFiles('trivy-backend.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-backend.sarif
          category: trivy-backend

  trivy-ocr:
    name: Trivy OCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Build OCR image for security scan
        run: docker build -t local/healthcare-ocr:scan ./OCR

      - name: Trivy gate - ocr (CRITICAL)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: local/healthcare-ocr:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Trivy SARIF - ocr
        if: always()
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: local/healthcare-ocr:scan
          format: sarif
          output: trivy-ocr.sarif
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: 0

      - name: Upload ocr SARIF
        if: always() && hashFiles('trivy-ocr.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-ocr.sarif
          category: trivy-ocr
