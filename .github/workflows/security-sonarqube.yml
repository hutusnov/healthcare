name: Security SonarQube

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  # Triggered only by pipeline-unified (after CI gates pass)
  # or manually. Removing push/pull_request prevents duplicate runs
  # alongside pipeline-unified on every commit.
  workflow_call:
  workflow_dispatch:

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarqube:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Normalize Sonar secrets
        shell: bash
        env:
          SONAR_TOKEN_RAW: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL_RAW: ${{ secrets.SONAR_HOST_URL }}
        run: |
          SONAR_TOKEN_CLEAN="$(printf '%s' "$SONAR_TOKEN_RAW" | tr -d '\r\n[:space:]')"
          SONAR_HOST_URL_CLEAN="$(printf '%s' "$SONAR_HOST_URL_RAW" | tr -d '\r\n[:space:]' | sed 's:/*$::')"
          echo "SONAR_TOKEN_CLEAN=$SONAR_TOKEN_CLEAN" >> "$GITHUB_ENV"
          echo "SONAR_HOST_URL_CLEAN=$SONAR_HOST_URL_CLEAN" >> "$GITHUB_ENV"

      - name: Validate SonarQube configuration
        shell: bash
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN_CLEAN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL_CLEAN }}
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ]; then
            echo "SonarQube configuration found."
          else
            echo "::error::Missing SONAR_TOKEN or SONAR_HOST_URL."
            exit 1
          fi

          if [ "$SONAR_HOST_URL" != "https://sonarcloud.io" ]; then
            echo "::error::SONAR_HOST_URL must be https://sonarcloud.io for SonarCloud."
            exit 1
          fi

      - name: Validate Sonar token against SonarCloud API
        shell: bash
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN_CLEAN }}
        run: |
          curl -fsS -u "${SONAR_TOKEN}:" "https://sonarcloud.io/api/authentication/validate" | tee /tmp/sonar-auth.json
          grep -q '"valid":[[:space:]]*true' /tmp/sonar-auth.json || {
            echo "::error::SONAR_TOKEN is invalid for SonarCloud API."
            exit 1
          }

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN_CLEAN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL_CLEAN }}

      - name: SonarQube quality gate
        id: quality_gate
        continue-on-error: true
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN_CLEAN }}
      - name: Fail if quality gate failed
        if: steps.quality_gate.outcome == 'failure'
        shell: bash
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN_CLEAN }}
        run: |
          # Action had 403 on CE task endpoint — check actual gate status via project_status API
          BRANCH="${{ github.head_ref || github.ref_name }}"
          RESPONSE=$(curl -fsS -u "${SONAR_TOKEN}:" \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=hutusnov_healthcare&branch=${BRANCH}")
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin)['projectStatus']['status'])")
          if [ "$STATUS" != "OK" ]; then
            echo "::error::SonarQube Quality Gate failed: $STATUS"
            exit 1
          fi
          echo "Quality gate confirmed OK via project_status API (action 403 on CE task was benign)"


  notify:
    name: Notify Telegram
    if: always()
    needs: [sonarqube]
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 Workflow: ${{ github.workflow }}
            👤 Actor: ${{ github.actor }}
            📝 Commit: ${{ github.sha }}
            📊 Status: ${{ job.status }}
            🔗 Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
