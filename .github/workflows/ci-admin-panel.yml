name: CI Admin Panel

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "BACK-END/PROJECT-TEST/admin-panel/**"
      - ".github/workflows/ci-admin-panel.yml"
  push:
    branches: [main, develop]
    paths:
      - "BACK-END/PROJECT-TEST/admin-panel/**"
      - ".github/workflows/ci-admin-panel.yml"

jobs:
  validate-admin-panel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BACK-END/PROJECT-TEST/admin-panel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: BACK-END/PROJECT-TEST/admin-panel/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_X_SECRET_VERIFY_HEADER: ${{ secrets.X_SECRET_VERIFY_HEADER }}
