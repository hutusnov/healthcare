name: CD Monitoring AWS

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

jobs:
  deploy-monitoring:
    runs-on: ubuntu-latest
    if: vars.ENABLE_AWS_MONITORING_DEPLOY == 'true' && vars.AWS_MONITORING_INSTANCE_ID != ''
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve online monitoring SSM target
        id: monitoring-target
        shell: bash
        env:
          CONFIGURED_INSTANCE_ID: ${{ vars.AWS_MONITORING_INSTANCE_ID }}
        run: |
          set -euo pipefail

          is_online_ssm_target() {
            local instance_id="$1"
            [ -n "$instance_id" ] || return 1

            local state ping
            state="$(aws ec2 describe-instances \
              --instance-ids "$instance_id" \
              --query 'Reservations[].Instances[?State.Name==`running`].InstanceId' \
              --output text 2>/dev/null || true)"
            [ -n "$state" ] || return 1

            ping="$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$instance_id" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text 2>/dev/null || true)"
            [ "$ping" = "Online" ]
          }

          selected=""
          if is_online_ssm_target "${CONFIGURED_INSTANCE_ID:-}"; then
            selected="$CONFIGURED_INSTANCE_ID"
          else
            echo "::warning::Configured AWS_MONITORING_INSTANCE_ID '${CONFIGURED_INSTANCE_ID:-<empty>}' is not a running online SSM target. Discovering monitoring node by tags."
            selected="$(aws ec2 describe-instances \
              --filters \
                "Name=instance-state-name,Values=running" \
                "Name=tag:Name,Values=WireGuard-VPN-Node,*Monitoring*" \
              --query 'Reservations[].Instances[].InstanceId' \
              --output text | tr '\t' '\n' | awk 'NF { print $1; exit }')"
          fi

          if ! is_online_ssm_target "$selected"; then
            echo "::error::No online monitoring SSM target found. Check AWS_MONITORING_INSTANCE_ID, SSM agent, IAM role, and network egress."
            exit 1
          fi

          echo "Using monitoring SSM target: $selected"
          echo "instance-id=$selected" >> "$GITHUB_OUTPUT"

      - name: Deploy monitoring over SSM
        env:
          MONITORING_INSTANCE_ID: ${{ steps.monitoring-target.outputs.instance-id }}
        run: |
          COMMANDS=$(cat <<'JSON'
          {"commands":[
            "set -e",
            "sudo systemctl enable --now docker || true",
            "sudo docker image prune -a -f --filter \"until=168h\" || true",
            "sudo rm -rf /var/lib/containerd/io.containerd.content.v1.content/ingest/* || true",
            "sudo rm -rf /var/lib/containerd/tmpmounts/* || true",
            "cd /opt/healthcare-monitoring && (sudo docker compose pull || (sudo systemctl restart docker || true; sleep 3; sudo docker compose pull))",
            "cd /opt/healthcare-monitoring && sudo docker compose up -d",
            "for i in $(seq 1 20); do curl -fsS http://127.0.0.1:9090/-/ready && curl -fsS http://127.0.0.1:3000/api/health && curl -fsS http://127.0.0.1:9093/-/ready && exit 0; sleep 5; done; exit 1"
          ]}
          JSON
          )
          echo "$COMMANDS" > commands-monitoring.json
          CID=$(aws ssm send-command --instance-ids "$MONITORING_INSTANCE_ID" --document-name AWS-RunShellScript --parameters file://commands-monitoring.json --query 'Command.CommandId' --output text)
          aws ssm wait command-executed --command-id "$CID" --instance-id "$MONITORING_INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$CID" --instance-id "$MONITORING_INSTANCE_ID" --output json
