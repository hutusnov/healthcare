name: CI Patient Portal

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "BACK-END/PROJECT-TEST/patient-portal/**"
      - ".github/workflows/ci-patient-portal.yml"
  push:
    branches: [main, develop]
    paths:
      - "BACK-END/PROJECT-TEST/patient-portal/**"
      - ".github/workflows/ci-patient-portal.yml"

jobs:
  validate-patient-portal:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BACK-END/PROJECT-TEST/patient-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: BACK-END/PROJECT-TEST/patient-portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_OCR_URL: ${{ secrets.VITE_OCR_URL }}
          VITE_OCR_API_KEY: ${{ secrets.VITE_OCR_API_KEY }}
          VITE_X_SECRET_VERIFY_HEADER: ${{ secrets.X_SECRET_VERIFY_HEADER }}
