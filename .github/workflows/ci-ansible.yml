name: CI Ansible

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_call:
  workflow_dispatch:

jobs:
  validate-ansible:
    name: validate-ansible
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: infra/ansible
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          ansible-galaxy collection install -r requirements.yml

      - name: Show Ansible version
        run: ansible --version

      - name: Allow dynamic inventory execution
        run: chmod +x inventory/openstack_dynamic.py

      - name: Validate static inventory
        run: ansible-inventory -i inventory/hosts.yml --list >/tmp/ansible-static-inventory.json

      - name: Validate dynamic inventory fallback
        run: python inventory/openstack_dynamic.py --list >/tmp/ansible-dynamic-inventory.json

  syntax-check:
    name: syntax-check (${{ matrix.playbook }})
    runs-on: ubuntu-latest
    needs: [validate-ansible]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        playbook:
          - audit.yml
          - packages.yml
          - preflight.yml
          - promtail.yml
          - site.yml
          - wireguard.yml
    defaults:
      run:
        working-directory: infra/ansible
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          ansible-galaxy collection install -r requirements.yml

      - name: Syntax check playbook
        run: ansible-playbook -i inventory/hosts.yml "playbooks/${{ matrix.playbook }}" --syntax-check

  notify:
    name: Notify Telegram
    if: always()
    needs: [validate-ansible, syntax-check]
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Workflow: ${{ github.workflow }}
            Actor: ${{ github.actor }}
            Commit: ${{ github.sha }}
            Status: ${{ job.status }}
            Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
