apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uit-healthcare-openstack-monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app.kubernetes.io/part-of: uit-healthcare
    app.kubernetes.io/managed-by: argocd
spec:
  project: uit-healthcare
  source:
    repoURL: https://github.com/hutusnov/healthcare.git
    targetRevision: main
    path: deploy/gitops/apps/openstack-monitoring/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
