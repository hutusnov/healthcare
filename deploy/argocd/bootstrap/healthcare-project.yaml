apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: uit-healthcare
  namespace: argocd
spec:
  description: UIT Healthcare hybrid GitOps project
  sourceRepos:
    - https://github.com/hutusnov/healthcare.git
    - https://grafana.github.io/helm-charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: uit-healthcare
    - server: https://kubernetes.default.svc
      namespace: uit-healthcare-prod
    - server: https://kubernetes.default.svc
      namespace: uit-healthcare-private
    - server: https://kubernetes.default.svc
      namespace: monitoring
    - server: https://kubernetes.default.svc
      namespace: argocd
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: PersistentVolumeClaim
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: apps
      kind: Deployment
    - group: apps
      kind: StatefulSet
    - group: apps
      kind: DaemonSet
    - group: networking.k8s.io
      kind: Ingress
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: policy
      kind: PodDisruptionBudget
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: monitoring.coreos.com
      kind: PrometheusRule
  orphanedResources:
    warn: true
  syncWindows:
    - kind: allow
      schedule: "0 1-17 * * *"
      duration: 16h
      applications:
        - "*"
      manualSync: true
