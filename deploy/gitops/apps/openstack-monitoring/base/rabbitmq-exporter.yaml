# rabbitmq_prometheus plugin đã enable sẵn ([E*] xác nhận qua rabbitmq-plugins list)
# Không cần exporter pod riêng — scrape trực tiếp port 15692 của host
# Dùng Service không có selector + Endpoints trỏ về data-core-node
apiVersion: v1
kind: Endpoints
metadata:
  name: rabbitmq-prometheus
  namespace: monitoring
subsets:
  - addresses:
      - ip: 192.168.100.83
    ports:
      - name: metrics
        port: 15692
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-prometheus
  namespace: monitoring
  labels:
    app: rabbitmq-prometheus
spec:
  ports:
    - name: metrics
      port: 15692
      targetPort: 15692
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rabbitmq-prometheus
  namespace: monitoring
  labels:
    release: o11y
spec:
  selector:
    matchLabels:
      app: rabbitmq-prometheus
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
      path: /metrics
