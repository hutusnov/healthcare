apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: uit-healthcare-monitoring
data:
  alert-rules.yml: |
    groups:
      - name: healthcare-backend
        rules:
          - alert: BackendAlbDown
            expr: up{job="backend-aws-alb"} == 0
            for: 3m
            labels:
              severity: critical
              service: backend
            annotations:
              summary: "Healthcare backend ALB metrics endpoint is down"
              description: "Prometheus in K3s cannot scrape the AWS backend ALB /metrics endpoint for more than 3 minutes."

      - name: healthcare-monitoring
        rules:
          - alert: PrometheusTargetDown
            expr: up == 0
            for: 5m
            labels:
              severity: warning
              service: monitoring
            annotations:
              summary: "A Prometheus target is down"
              description: "Target {{ $labels.job }} {{ $labels.instance }} has been down for more than 5 minutes."
