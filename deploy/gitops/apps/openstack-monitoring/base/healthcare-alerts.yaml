apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: healthcare-infrastructure-rules
  namespace: monitoring
  labels:
    release: o11y
spec:
  groups:
  - name: healthcare.nodes
    rules:
    - alert: NodeDiskHigh
      expr: (1 - node_filesystem_avail_bytes{fstype!="tmpfs",mountpoint="/"} / node_filesystem_size_bytes{fstype!="tmpfs",mountpoint="/"}) * 100 > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Node disk usage high: {{ $labels.instance }}"
        description: "Disk usage is {{ $value | humanize }}% on {{ $labels.instance }}"

    - alert: NodeDiskCritical
      expr: (1 - node_filesystem_avail_bytes{fstype!="tmpfs",mountpoint="/"} / node_filesystem_size_bytes{fstype!="tmpfs",mountpoint="/"}) * 100 > 90
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Node disk critical: {{ $labels.instance }}"
        description: "Disk usage is {{ $value | humanize }}% on {{ $labels.instance }}"

    - alert: NodeMemoryHigh
      expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Node memory high: {{ $labels.instance }}"
        description: "Memory usage is {{ $value | humanize }}% on {{ $labels.instance }}"

    - alert: NodeCPUHigh
      expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Node CPU high: {{ $labels.instance }}"
        description: "CPU usage is {{ $value | humanize }}% on {{ $labels.instance }}"

  - name: healthcare.pods
    rules:
    - alert: PodCrashLooping
      expr: rate(kube_pod_container_status_restarts_total[15m]) * 60 * 15 > 3
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Pod crash looping: {{ $labels.pod }}"
        description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} restarted {{ $value | humanize }} times"

    - alert: PodNotReady
      expr: kube_pod_status_ready{condition="true"} == 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Pod not ready: {{ $labels.pod }}"
        description: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is not ready"

    - alert: OCRServiceDown
      expr: kube_pod_status_ready{namespace="uit-healthcare",pod=~"ocr-service.*",condition="true"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "OCR Service is DOWN"
        description: "OCR pod {{ $labels.pod }} is not ready in namespace {{ $labels.namespace }}"

  - name: healthcare.backend
    rules:
    - alert: BackendDown
      expr: up{job="aws-backend-app"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Backend AWS is DOWN"
        description: "Backend instance {{ $labels.instance }} is not responding"

  - name: healthcare.postgres
    rules:
    - alert: PostgresDown
      expr: up{job="postgres-exporter"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "PostgreSQL is DOWN"
        description: "postgres-exporter không thể kết nối PostgreSQL trên data-core-node"

    - alert: TooManyConnections
      expr: sum(pg_stat_activity_count) > 80
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "PostgreSQL quá nhiều connections"
        description: "Connection count hiện tại: {{ $value }} (ngưỡng: 80)"

    - alert: TooManyConnectionsCritical
      expr: sum(pg_stat_activity_count) > 95
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "PostgreSQL connections gần đầy"
        description: "Connection count: {{ $value }} — sắp đạt max_connections"

    - alert: DBDiskUsageHigh
      expr: pg_database_size_bytes{datname="project_test"} > 5368709120
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "PostgreSQL database size cao"
        description: "Database project_test đạt {{ $value | humanize1024 }} (ngưỡng: 5 GiB)"

    - alert: PostgresDeadlockDetected
      expr: rate(pg_stat_database_deadlocks_total{datname="project_test"}[5m]) > 0
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: "PostgreSQL có deadlock"
        description: "Phát hiện deadlock trên database project_test"

  - name: healthcare.redis
    rules:
    - alert: RedisDown
      expr: up{job="redis-exporter"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Redis is DOWN"
        description: "redis-exporter không thể kết nối Redis trên data-core-node"

    - alert: RedisTooManyClients
      expr: redis_connected_clients{job="redis-exporter"} > 100
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Redis quá nhiều connected clients"
        description: "Số client hiện tại: {{ $value }} (ngưỡng: 100)"

    - alert: RedisMemoryHigh
      expr: (redis_memory_used_bytes{job="redis-exporter"} / redis_memory_max_bytes{job="redis-exporter"} * 100 > 80) and redis_memory_max_bytes{job="redis-exporter"} > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Redis memory sử dụng cao"
        description: "Redis đang dùng {{ $value | humanize }}% max memory"

    - alert: RedisMemoryCritical
      expr: (redis_memory_used_bytes{job="redis-exporter"} / redis_memory_max_bytes{job="redis-exporter"} * 100 > 95) and redis_memory_max_bytes{job="redis-exporter"} > 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Redis sắp hết memory"
        description: "Redis đang dùng {{ $value | humanize }}% max memory — có thể bắt đầu evict keys"

    - alert: RedisHighKeyEviction
      expr: rate(redis_evicted_keys_total{job="redis-exporter"}[5m]) > 10
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Redis evicting keys nhiều"
        description: "Redis đang evict {{ $value | humanize }} keys/s — memory pressure cao"

  - name: healthcare.rabbitmq
    rules:
    - alert: RabbitMQDown
      expr: up{job="rabbitmq-prometheus"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "RabbitMQ is DOWN"
        description: "rabbitmq-exporter không thể kết nối RabbitMQ trên data-core-node"

    - alert: RabbitMQQueueBacklog
      expr: rabbitmq_queue_messages_ready{job="rabbitmq-prometheus"} > 1000
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "RabbitMQ queue backlog lớn: {{ $labels.queue }}"
        description: "Queue {{ $labels.queue }} có {{ $value | humanize }} messages chờ xử lý"

    - alert: RabbitMQQueueBacklogCritical
      expr: rabbitmq_queue_messages_ready{job="rabbitmq-prometheus"} > 5000
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "RabbitMQ queue backlog nghiêm trọng: {{ $labels.queue }}"
        description: "Queue {{ $labels.queue }} có {{ $value | humanize }} messages — consumer có thể bị stuck"

    - alert: RabbitMQNoConsumers
      expr: rabbitmq_queue_messages_ready{job="rabbitmq-prometheus"} > 10 and rabbitmq_consumers{job="rabbitmq-prometheus"} == 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "RabbitMQ không có consumer"
        description: "Có messages trong queue nhưng không có consumer đang chạy"

    - alert: RabbitMQMemoryHigh
      expr: (rabbitmq_node_mem_used{job="rabbitmq-prometheus"} / rabbitmq_node_mem_limit{job="rabbitmq-prometheus"} * 100 > 80) and rabbitmq_node_mem_limit{job="rabbitmq-prometheus"} > 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "RabbitMQ memory cao"
        description: "RabbitMQ đang dùng {{ $value | humanize }}% memory limit"

---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: healthcare-loki-rules
  namespace: monitoring
  labels:
    release: o11y
spec:
  groups:
  - name: healthcare.loki
    rules:
    - alert: LokiDown
      expr: up{job="loki"} == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Loki is DOWN"
        description: "Loki log aggregator không responding — logs không được thu thập"
