apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-loki-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  loki-logs.json: |-
    {
      "title": "UIT Healthcare - Logs",
      "uid": "loki-logs",
      "tags": ["loki", "logs"],
      "timezone": "browser",
      "refresh": "30s",
      "schemaVersion": 39,
      "time": {"from": "now-1h", "to": "now"},
      "panels": [
        {
          "id": 1,
          "title": "Pod Logs by Namespace",
          "type": "logs",
          "gridPos": {"h": 12, "w": 24, "x": 0, "y": 0},
          "datasource": {"type": "loki", "uid": "efmis3az8o4cgf"},
          "targets": [{
            "expr": "{namespace=~\"monitoring|uit-healthcare|uit-healthcare-private|argocd\"}",
            "refId": "A"
          }],
          "options": {
            "showTime": true,
            "showLabels": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending",
            "enableLogDetails": true
          }
        },
        {
          "id": 2,
          "title": "Error Logs",
          "type": "logs",
          "gridPos": {"h": 12, "w": 24, "x": 0, "y": 12},
          "datasource": {"type": "loki", "uid": "efmis3az8o4cgf"},
          "targets": [{
            "expr": "{namespace=~\"monitoring|uit-healthcare|uit-healthcare-private\"} |~ \"(?i)error|exception|fatal\"",
            "refId": "A"
          }],
          "options": {
            "showTime": true,
            "showLabels": true,
            "wrapLogMessage": true,
            "sortOrder": "Descending"
          }
        }
      ]
    }
