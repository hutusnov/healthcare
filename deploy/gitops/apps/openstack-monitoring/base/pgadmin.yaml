# Secrets phải tạo thủ công trên cluster — KHÔNG commit lên git:
# kubectl -n monitoring create secret generic pgadmin-secret \
#   --from-literal=PGADMIN_DEFAULT_EMAIL=pgadmin@healthcare.htsnov.com \
#   --from-literal='PGADMIN_DEFAULT_PASSWORD=PASSWORD'
#
# kubectl -n monitoring create secret generic pgadmin-pgpass \
#   --from-literal=pgpass='192.168.100.83:5432:*:project:StrongPass123!'
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgadmin-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-servers-config
  namespace: monitoring
data:
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "Healthcare PostgreSQL",
          "Group": "Servers",
          "Host": "192.168.100.83",
          "Port": 5432,
          "MaintenanceDB": "project_test",
          "Username": "project",
          "SSLMode": "disable",
          "PassFile": "/pgpassdir/pgpass"
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: monitoring
  labels:
    app: pgadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
    spec:
      nodeSelector:
        kubernetes.io/hostname: data-core-node
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:8.6
          ports:
            - name: http
              containerPort: 80
          env:
            - name: PGADMIN_DEFAULT_EMAIL
              valueFrom:
                secretKeyRef:
                  name: pgadmin-secret
                  key: PGADMIN_DEFAULT_EMAIL
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pgadmin-secret
                  key: PGADMIN_DEFAULT_PASSWORD
            # Werkzeug ProxyFix: strips Cloudflare PoP IP from X-Forwarded-For so
            # Flask-Login sees a consistent user IP for session _id computation.
            # Without this, different Cloudflare PoPs produce different IPs → _id
            # mismatch → session cleared → 401 on every post-login API call.
            - name: PGADMIN_CONFIG_PROXY_X_FOR_COUNT
              value: "1"
            - name: PGADMIN_CONFIG_PROXY_X_PROTO_COUNT
              value: "1"
            - name: PGADMIN_CONFIG_PROXY_X_HOST_COUNT
              value: "1"
            - name: PGADMIN_CONFIG_PROXY_X_PREFIX_COUNT
              value: "1"
            - name: PGADMIN_CONFIG_WTF_CSRF_SSL_STRICT
              value: "False"
            - name: PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION
              value: "False"
            - name: PGADMIN_CONFIG_SESSION_COOKIE_SECURE
              value: "True"
            - name: PGADMIN_CONFIG_SESSION_COOKIE_SAMESITE
              value: "'None'"
          volumeMounts:
            - name: pgadmin-data
              mountPath: /var/lib/pgadmin
            - name: pgadmin-servers
              mountPath: /pgadmin4/servers.json
              subPath: servers.json
              readOnly: true
            - name: pgadmin-pgpass
              mountPath: /pgpassdir
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: pgadmin-data
          persistentVolumeClaim:
            claimName: pgadmin-data
        - name: pgadmin-servers
          configMap:
            name: pgadmin-servers-config
        - name: pgadmin-pgpass
          secret:
            secretName: pgadmin-pgpass
            defaultMode: 0600
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: monitoring
  labels:
    app: pgadmin
spec:
  selector:
    app: pgadmin
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pgadmin-ingress
  namespace: monitoring
  annotations:
    cert-manager.io/issuer: letsencrypt-prod
    cert-manager.io/issuer-kind: ClusterOriginIssuer
    cert-manager.io/issuer-group: cert-manager.k8s.cloudflare.com
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - pgadmin-healthcare.htsnov.com
      secretName: tls-secret-pgadmin
  rules:
    - host: pgadmin-healthcare.htsnov.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pgadmin
                port:
                  number: 80
