apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-rabbitmq-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  rabbitmq-dashboard.json: |
    {
      "title": "RabbitMQ - UIT Healthcare",
      "uid": "rabbitmq-healthcare",
      "timezone": "browser",
      "refresh": "30s",
      "schemaVersion": 36,
      "panels": [
        {
          "id": 1,
          "title": "RabbitMQ Up",
          "type": "stat",
          "gridPos": { "x": 0, "y": 0, "w": 3, "h": 4 },
          "targets": [{
            "expr": "up{job=\"rabbitmq-prometheus\"}",
            "legendFormat": "Status"
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background" },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
              ]
            }
          }
        },
        {
          "id": 2,
          "title": "Queues",
          "type": "stat",
          "gridPos": { "x": 3, "y": 0, "w": 3, "h": 4 },
          "targets": [{
            "expr": "rabbitmq_queues{job=\"rabbitmq-prometheus\"}",
            "legendFormat": "Queues"
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 3,
          "title": "Messages Ready",
          "type": "stat",
          "gridPos": { "x": 6, "y": 0, "w": 3, "h": 4 },
          "targets": [{
            "expr": "rabbitmq_queue_messages_ready{job=\"rabbitmq-prometheus\"}",
            "legendFormat": "Ready"
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 100 }, { "color": "red", "value": 1000 }] }
            }
          }
        },
        {
          "id": 4,
          "title": "Messages Unacked",
          "type": "stat",
          "gridPos": { "x": 9, "y": 0, "w": 3, "h": 4 },
          "targets": [{
            "expr": "rabbitmq_queue_messages_unacknowledged{job=\"rabbitmq-prometheus\"}",
            "legendFormat": "Unacked"
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 50 }, { "color": "red", "value": 200 }] }
            }
          }
        },
        {
          "id": 5,
          "title": "Consumers",
          "type": "stat",
          "gridPos": { "x": 12, "y": 0, "w": 3, "h": 4 },
          "targets": [{
            "expr": "rabbitmq_consumers{job=\"rabbitmq-prometheus\"}",
            "legendFormat": "Consumers"
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 6,
          "title": "Connections",
          "type": "stat",
          "gridPos": { "x": 15, "y": 0, "w": 3, "h": 4 },
          "targets": [{
            "expr": "rabbitmq_connections{job=\"rabbitmq-prometheus\"}",
            "legendFormat": "Connections"
          }],
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] } }
        },
        {
          "id": 7,
          "title": "Messages Published / Delivered per Second",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 4, "w": 12, "h": 8 },
          "targets": [
            { "expr": "rate(rabbitmq_queue_messages_published_total{job=\"rabbitmq-prometheus\"}[1m])", "legendFormat": "Published/s" },
            { "expr": "rate(rabbitmq_queue_messages_delivered_total{job=\"rabbitmq-prometheus\"}[1m])", "legendFormat": "Delivered/s" }
          ],
          "fieldConfig": { "defaults": { "unit": "msgs" } }
        },
        {
          "id": 8,
          "title": "Messages Ready by Queue",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 4, "w": 12, "h": 8 },
          "targets": [{
            "expr": "rabbitmq_queue_messages_ready{job=\"rabbitmq-prometheus\"}",
            "legendFormat": "{{ queue }}"
          }],
          "fieldConfig": { "defaults": { "unit": "short" } }
        },
        {
          "id": 9,
          "title": "Memory Used",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 12, "w": 12, "h": 8 },
          "targets": [{
            "expr": "rabbitmq_node_mem_used{job=\"rabbitmq-prometheus\"}",
            "legendFormat": "Memory Used"
          }],
          "fieldConfig": { "defaults": { "unit": "bytes" } }
        },
        {
          "id": 10,
          "title": "Channels",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 12, "w": 12, "h": 8 },
          "targets": [{
            "expr": "rabbitmq_channels{job=\"rabbitmq-prometheus\"}",
            "legendFormat": "Channels"
          }],
          "fieldConfig": { "defaults": { "unit": "short" } }
        }
      ]
    }
