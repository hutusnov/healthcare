apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  # - ingress.yaml  # Disabled: backend runs on EC2 Docker (CloudFront → ALB), not K8s. Kept for future migration.
  - networkpolicy.yaml
  - pdb.yaml
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: backend-api
      app.kubernetes.io/part-of: uit-healthcare
